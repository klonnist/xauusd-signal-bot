name: XAUUSD Signal

on:
  schedule:
    # Her saat basi calisir (UTC). Altin piyasasi 7/24'e yakin acik oldugu
    # icin hafta sonu bosluklarini ayirt etmeye gerek yok; yfinance zaten
    # veri yoksa hata dondurur ve is basarisiz olarak isaretlenir.
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        run: python xauusd_signal.py

      - name: Commit updated log
        run: |
          git config user.name "xauusd-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals_log.csv docs/data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update signals log"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::push failed after retries"
          exit 1
